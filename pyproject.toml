[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "concilium-llm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
concilium = "concilium.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["concilium*"]
